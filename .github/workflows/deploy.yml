name: Deploy Drawlead

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.PORT }}
          script: |
            set -e
            cd /opt/drawlead
            git fetch origin main
            git reset --hard origin/main
            if [ -n "${{ secrets.RESEND_API_KEY }}" ]; then
              if grep -q '^RESEND_API_KEY=' backend/.env 2>/dev/null; then
                sed -i "s|^RESEND_API_KEY=.*|RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}|" backend/.env
              else
                echo "RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}" >> backend/.env
              fi
            fi
            if [ -n "${{ secrets.VAPID_PUBLIC_KEY }}" ] && [ -n "${{ secrets.VAPID_PRIVATE_KEY }}" ]; then
              for pair in \
                "VAPID_PUBLIC_KEY=${{ secrets.VAPID_PUBLIC_KEY }}" \
                "VAPID_PRIVATE_KEY=${{ secrets.VAPID_PRIVATE_KEY }}" \
                "VAPID_CLAIMS_EMAIL=${{ secrets.VAPID_CLAIMS_EMAIL || 'admin@drawlead.com' }}"; do
                key="${pair%%=*}"
                if grep -q "^${key}=" backend/.env 2>/dev/null; then
                  sed -i "s|^${key}=.*|${pair}|" backend/.env
                else
                  echo "${pair}" >> backend/.env
                fi
              done
            fi
            /root/deploy-drawlead.sh
            # deploy-drawlead.sh does its own pm2 restart as part of the normal
            # deploy, which (without --update-env) can reapply pm2's last-cached
            # environment snapshot and silently undo the .env edits above. Force
            # one more restart with --update-env last, so it's the final word.
            pm2 restart drawlead-backend --update-env || true