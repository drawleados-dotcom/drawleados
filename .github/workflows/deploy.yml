name: Deploy to Hostinger VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:   # allow manual trigger from GitHub UI

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      # Lightweight sanity build on CI (catches breaks before touching prod)
      - name: Frontend - install & build (CI sanity)
        working-directory: frontend
        env:
          REACT_APP_BACKEND_URL: https://os.drawlead.com
          CI: false
        run: |
          yarn install --frozen-lockfile
          yarn build

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Backend - install requirements (CI sanity)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ------------ Deploy to VPS over SSH ------------
      - name: Add VPS to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.VPS_PORT }} -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Deploy on VPS
        run: |
          ssh -p ${{ secrets.VPS_PORT }} ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} <<'EOF'
            set -euo pipefail
            cd /var/www/drawlead

            echo "→ Pulling latest code"
            git fetch origin
            git reset --hard origin/main

            echo "→ Backend: install python deps"
            cd backend
            source venv/bin/activate
            pip install -r requirements.txt
            deactivate

            echo "→ Frontend: build"
            cd ../frontend
            yarn install --frozen-lockfile
            yarn build

            echo "→ Restart backend via PM2"
            pm2 restart drawlead-backend

            echo "→ Reload nginx"
            sudo nginx -t && sudo systemctl reload nginx

            echo "✅ Deploy finished"
          EOF

      - name: Health check
        run: |
          sleep 5
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://os.drawlead.com/api/health || echo "000")
          echo "Health check returned: $STATUS"
          if [ "$STATUS" != "200" ] && [ "$STATUS" != "404" ]; then
            echo "⚠️  Backend returned $STATUS — please check pm2 logs on VPS"
          fi
