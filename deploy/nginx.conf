# nginx config — frontend container
# Serves the React build + reverse-proxies /api/* to the backend container.

server {
    listen 80 default_server;
    server_name _;

    # Increase max upload size for logos/signatures/file uploads
    client_max_body_size 25M;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;

    # Static assets — long cache (the React build hashes filenames)
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Reverse-proxy /api/* to backend container
    location /api/ {
        proxy_pass http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        # No buffering on long requests (PDF/large data)
        proxy_buffering off;
    }

    # SPA fallback — everything else returns index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
