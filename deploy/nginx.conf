# nginx config — frontend container
# Serves the React build + reverse-proxies /api/* to the backend container.

# We sit behind an HTTPS-terminating edge proxy (e.g. Cloudflare) that always
# connects to us over plain HTTP. Trust its X-Forwarded-Proto when present
# instead of overwriting it with our own (always "http") $scheme — otherwise
# backend code that derives absolute URLs (e.g. Google OAuth redirect_uri)
# incorrectly builds them as http:// instead of https://.
map $http_x_forwarded_proto $proxy_x_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80 default_server;
    server_name _;

    # Increase max upload size for logos/signatures/file uploads
    client_max_body_size 25M;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS — lets nginx resolve "backend" lazily at request time
    # so the container doesn't crash on boot if backend isn't ready yet.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Static assets — long cache (the React build hashes filenames)
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Reverse-proxy /api/* to backend container
    location /api/ {
        # Variable forces deferred DNS resolution → no startup crash
        set $upstream_backend "backend:8001";
        proxy_pass http://$upstream_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        # No buffering on long requests (PDF/large data)
        proxy_buffering off;
    }

    # SPA fallback — everything else returns index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
